name: Yap
options:
  bundleIdPrefix: com.timothykoelsch
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

targets:
  Yap:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Yap
    info:
      path: Yap/Info.plist
      properties:
        CFBundleDisplayName: Yap
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSMicrophoneUsageDescription: "Yap uses your microphone to transcribe your spoken journal entries entirely on your device."
        NSSpeechRecognitionUsageDescription: "Yap uses on-device speech recognition to transcribe your journal entries, live as you talk."
        UIStatusBarStyle: UIStatusBarStyleDefault
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UILaunchScreen:
          UIColorName: AccentColor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timothykoelsch.Yap
        PRODUCT_NAME: Yap
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES

schemes:
  Yap:
    build:
      targets:
        Yap: all
    run:
      config: Debug
