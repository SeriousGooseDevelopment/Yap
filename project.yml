name: Yap
options:
  bundleIdPrefix: com.timothykoelsch
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

targets:
  Yap:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Yap
      - path: Shared
    dependencies:
      - target: YapWidgets
    info:
      path: Yap/Info.plist
      properties:
        CFBundleDisplayName: Yap
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSMicrophoneUsageDescription: "Yap uses your microphone to transcribe your spoken journal entries entirely on your device."
        NSSpeechRecognitionUsageDescription: "Yap uses on-device speech recognition to transcribe your journal entries, live as you talk."
        NSFaceIDUsageDescription: "Yap can lock your journal with Face ID so only you can open it."
        # Recording keeps going on the Lock Screen, shown as a Live Activity.
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - audio
        UIStatusBarStyle: UIStatusBarStyleDefault
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UILaunchScreen:
          UIColorName: LaunchBackground
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timothykoelsch.Yap
        PRODUCT_NAME: Yap
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  # The recording Live Activity (Lock Screen card + Dynamic Island).
  YapWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: YapWidgets
      - path: Shared
    info:
      path: YapWidgets/Info.plist
      properties:
        CFBundleDisplayName: Yap
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timothykoelsch.Yap.Widgets
        PRODUCT_NAME: YapWidgets
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        SKIP_INSTALL: YES
        SWIFT_EMIT_LOC_STRINGS: YES

schemes:
  Yap:
    build:
      targets:
        Yap: all
    run:
      config: Debug
